name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# All builds run here — no local Rust/Gradle builds (AGENTS.md rule 10).
jobs:
  rust-host:
    name: Rust (host — fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/actions-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  rust-android:
    # Phase A, Gate 1: does the core (alacritty_terminal 0.26.0 + deps)
    # cross-compile for aarch64-linux-android?
    name: Gate 1 — Rust cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/actions-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check for Android target
        run: cargo check --workspace --target aarch64-linux-android
      - name: Clippy for Android target (deny warnings)
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Ensure Gradle
        # No wrapper jar is committed to git; use the runner's Gradle when
        # present, otherwise install the pinned version.
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
            unzip -q gradle-8.13-bin.zip
            echo "$GITHUB_WORKSPACE/gradle-8.13/bin" >> "$GITHUB_PATH"
          fi
          gradle --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
