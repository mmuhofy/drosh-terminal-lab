name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned NDK (r28c): the Rust core is linked with its clang.
  NDK_VERSION: 28.2.13676358

# All builds run here — no local Rust/Gradle builds (AGENTS.md rule 10).
jobs:
  rust-host:
    name: Rust (host — fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  rust-android:
    # Phase A, Gate 1: does the core (alacritty_terminal 0.26.0 + deps)
    # cross-compile for aarch64-linux-android?
    name: Gate 1 — Rust cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check for Android target
        run: cargo check --workspace --target aarch64-linux-android
      - name: Clippy for Android target (deny warnings)
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  gate2-font:
    # Phase B, Gate 2: the font crates cross-compile for Android, and the bundled
    # font really produces the single-channel masks the Kotlin atlas is fed with.
    # (Gate 1's workspace check already covers the compile half; this job is the
    # named gate plus the behavioural half.)
    name: Gate 2 — Rust font stack (swash glyphs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Font stack against the bundled font
        run: cargo test -p drosh-core --test font_tests
      - name: Cross-check the font stack for Android
        run: cargo check -p drosh-core --lib --target aarch64-linux-android

  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK (with NDK)
        # Manual setup: android-actions/setup-android@v3 fails because it
        # still asks sdkmanager for the removed legacy "tools" package.
        # cmdline-tools build 11076708 is a stable, long-lived download.
        # NDK 28.2.13676358 (r28c) is pinned: the Rust core is linked with its
        # clang, so the toolchain must not drift.
        run: |
          set -euo pipefail
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          # The runner image ships its own NDK and points ANDROID_NDK* at it.
          # These two cover tools that read the environment; the Rust build step
          # sets its own copies at step level, and those always win.
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_DIR/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace lives in rust/, not at the repo root.
          workspaces: rust
      - name: Add the Android target
        run: rustup target add aarch64-linux-android
      - name: Build the Rust core for arm64-v8a
        # The APK only works with libdrosh_core.so inside it. The NDK toolchain
        # is wired into cargo directly (`cc`/linker env vars) rather than through
        # cargo-ndk: the runner image pre-sets ANDROID_NDK/ANDROID_NDK_ROOT to its
        # own NDK and cargo-ndk 4 aborts when they disagree with ours.
        env:
          ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/28.2.13676358
        run: |
          set -euo pipefail
          NDK="$RUNNER_TEMP/android-sdk/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cd rust
          cargo build --release --target aarch64-linux-android
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libdrosh_core.so \
            ../android/app/src/main/jniLibs/arm64-v8a/
          ls -l ../android/app/src/main/jniLibs/arm64-v8a/
      - name: Ensure Gradle
        # No wrapper jar is committed to git; use the runner's Gradle when
        # present, otherwise install the pinned version.
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
            unzip -q gradle-8.13-bin.zip
            echo "$GITHUB_WORKSPACE/gradle-8.13/bin" >> "$GITHUB_PATH"
          fi
          gradle --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (Kotlin)
        # The input encoder is pure logic and its sequences are pinned as tests;
        # a wrong arrow-key form is otherwise only visible on a device.
        working-directory: android
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Check the APK carries the core
        # An APK without the .so starts and dies on System.loadLibrary; fail
        # here instead of on the device.
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdrosh_core.so"
          echo "$APK contains libdrosh_core.so"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
